义时长<\/div><\/div><\/div>\n    <\/div>\n    <div style=\"display:flex;gap:10px;margin-top:14px\"><input class=\"input\" value=\"5–10 岁\" aria-label=\"受众\"><input class=\"input\" value=\"计划 520 集\" aria-label=\"集数\"><\/div>\n    <button class=\"btn btn-primary\" style=\"margin-top:18px\" onclick=\"go(1)\">下一步<\/button>\n  <\/section>\n  <section data-step=\"1\" class=\"enter\">\n    <h2 class=\"display\" style=\"font-size:28px;margin:0 0 6px\">把已有资料丢进来<\/h2><p class=\"muted\" style=\"margin:0 0 18px\">创作大纲、人物设定、通过的剧本、导演意见截图都可以。AI 会读完，整理成项目圣经。<\/p>\n    <div class=\"card\" style=\"padding:24px;border-style:dashed;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M22 12h-6l-2 3h-4l-2-3H2M5.5 5h13L22 12v7H2v-7Z\"/><\/svg><b>拖入文件，或点击选择<\/b><span class=\"muted\" style=\"font-size:12px\">docx / pdf / txt / 图片 / 录音 · 资料只存在团队空间和本机<\/span><\/div>\n    <div id=\"parse-out\" style=\"display:flex;flex-direction:column;gap:8px;margin-top:12px\"><\/div>\n    <button class=\"btn btn-primary\" style=\"margin-top:16px\" onclick=\"parseDocs(this)\">解析示例资料<\/button>\n  <\/section>\n  <section data-step=\"2\" class=\"enter\">\n    <h2 class=\"display\" style=\"font-size:28px;margin:0 0 6px\">这些是我读出来的规则，对吗？<\/h2><p class=\"muted\" style=\"margin:0 0 14px\"><b>硬规则<\/b>每次生成都不能违反；<b>偏好<\/b>会尽量遵守，可以被具体要求覆盖。<\/p>\n    <div style=\"display:flex;flex-direction:column;gap:6px\"><div class=\"rule\" style=\"display:flex;gap:12px;align-items:center\"><b style=\"width:44px;flex:none\">受众<\/b><span style=\"flex:1\">5–10 岁儿童，正在养成品格的阶段<\/span>\n      <span class=\"chip\" style=\"height:22px;cursor:pointer\" onclick=\"this.textContent=this.textContent==='硬规则'?'偏好':'硬规则'\">硬规则<\/span><\/div><div class=\"rule\" style=\"display:flex;gap:12px;align-items:center\"><b style=\"width:44px;flex:none\">时长<\/b><span style=\"flex:1\">每集 10 分钟，一集一个故事，剧本约 5,000 字<\/span>\n      <span class=\"chip\" style=\"height:22px;cursor:pointer\" onclick=\"this.textContent=this.textContent==='硬规则'?'偏好':'硬规则'\">硬规则<\/span><\/div><div class=\"rule\" style=\"display:flex;gap:12px;align-items:center\"><b style=\"width:44px;flex:none\">调性<\/b><span style=\"flex:1\">温暖现实主义 + 奇幻，都市家庭轻喜剧<\/span>\n      <span class=\"chip\" style=\"height:22px;cursor:pointer\" onclick=\"this.textContent=this.textContent==='硬规则'?'偏好':'硬规则'\">硬规则<\/span><\/div><div class=\"rule\" style=\"display:flex;gap:12px;align-items:center\"><b style=\"width:44px;flex:none\">背景<\/b><span style=\"flex:1\">当代北京胡同、三代同堂、家庭和学校生活（不是传统文化讲解）<\/span>\n      <span class=\"chip\" style=\"height:22px;cursor:pointer\" onclick=\"this.textContent=this.textContent==='硬规则'?'偏好':'硬规则'\">硬规则<\/span><\/div><div class=\"rule\" style=\"display:flex;gap:12px;align-items:center\"><b style=\"width:44px;flex:none\">人物<\/b><span style=\"flex:1\">门墩儿只有豆豆看得见<\/span>\n      <span class=\"chip\" style=\"height:22px;cursor:pointer\" onclick=\"this.textContent=this.textContent==='硬规则'?'偏好':'硬规则'\">硬规则<\/span><\/div><div class=\"rule\" style=\"display:flex;gap:12px;align-items:center\"><b style=\"width:44px;flex:none\">幽默<\/b><span style=\"flex:1\">笑点来自人物性格和处境，不用摔跤、踩香蕉皮类笑点<\/span>\n      <span class=\"chip\" style=\"height:22px;cursor:pointer\" onclick=\"this.textContent=this.textContent==='硬规则'?'偏好':'硬规则'\">偏好<\/span><\/div><div class=\"rule\" style=\"display:flex;gap:12px;align-items:center\"><b style=\"width:44px;flex:none\">价值<\/b><span style=\"flex:1\">教育意义藏在人物的选择里，结尾不说教<\/span>\n      <span class=\"chip\" style=\"height:22px;cursor:pointer\" onclick=\"this.textContent=this.textContent==='硬规则'?'偏好':'硬规则'\">偏好<\/span><\/div><\/div>\n    <div style=\"display:flex;gap:8px;margin-top:16px\"><button class=\"btn btn-ghost\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"/><\/svg> 添加规则<\/button><button class=\"btn btn-primary\" onclick=\"toast('项目圣经已建立 · 7 条规则 · 1 份范本')\">确认，进入选题池<\/button><\/div>\n  <\/section><\/div>\n    <div class=\"muted\" style=\"font-size:12px\">按 <span class=\"kbd\">Enter<\/span> 继续 · <span class=\"kbd\">Esc<\/span> 稍后再说<\/div>\n  <\/div><script>\n  let step=0; function go(n){step=n;document.querySelectorAll('[data-step]').forEach(el=>el.hidden=+el.dataset.step!==step);\n    document.querySelectorAll('[data-dot]').forEach(d=>d.classList.toggle('on',+d.dataset.dot<=step));}\n  async function parseDocs(b){b.disabled=true;const o=document.getElementById('parse-out');\n    for(const [f,t] of [['创作大纲.docx','42 页 · 抽出 9 个角色、7 大主题'],['第1集 · 范本剧本.docx','5,132 字 · 设为格式范本'],['往期剧本 ×5','26,480 字 · 加入案例库']]){\n      const r=document.createElement('div');r.className='tool enter';r.innerHTML='<span class=\"spin\"><\/span><b>'+f+'<\/b><span class=\"muted\" style=\"margin-left:auto\">解析中…<\/span>';o.appendChild(r);\n      await wait(600);r.querySelector('.spin').outerHTML='<span class=\"ok\">✓<\/span>';r.querySelector('.muted').textContent=t;}\n    b.textContent='下一步：确认规则';b.disabled=false;b.onclick=()=>go(2);}\n  go(0);\n<\/script><\/div>\n<\/div>\n<div class=\"toast\" id=\"toast\"><span><\/span><\/div>\n<script>// Shared runtime injected into every layer document.\n(function () {\n  // The parent switcher tells each layer which OS chrome to draw.\n  window.addEventListener('message', function (e) {\n    if (e.data && e.data.type === 'proto:os') document.body.dataset.os = e.data.os;\n  });\n  var os = new URLSearchParams(location.hash.slice(1)).get('os');\n  document.body.dataset.os = os || 'mac';\n\n  var toastTimer;\n  window.toast = function (text) {\n    var el = document.getElementById('toast');\n    if (!el) return;\n    el.querySelector('span').textContent = text;\n    el.classList.add('show');\n    clearTimeout(toastTimer);\n    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2600);\n  };\n  window.wait = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };\n  window.openModal = function (id) { document.getElementById(id).classList.add('open'); };\n  window.closeModal = function (id) { document.getElementById(id).classList.remove('open'); };\n  document.addEventListener('keydown', function (e) {\n    if (e.key === 'Escape') document.querySelectorAll('.scrim.open').forEach(function (s) { s.classList.remove('open'); });\n  });\n})();\n<\/script>\n<\/body>\n<\/html>","p3-a":"<!doctype html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>选题池 · 每日热点 · A · Studio Paper<\/title>\n<style>/* Shared base for every layer. Direction themes only override tokens + layout. */\n*, *::before, *::after { box-sizing: border-box; }\nhtml, body { margin: 0; height: 100%; }\nbody {\n  font-family: var(--font-ui);\n  font-size: 14px;\n  line-height: 1.5;\n  color: var(--ink);\n  background: var(--desk);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  text-rendering: optimizeLegibility;\n  overflow: hidden;\n}\n:root {\n  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);\n  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);\n  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);\n  --font-mono: \"Courier Prime\", \"Courier New\", ui-monospace, monospace;\n  --font-script: \"Courier Prime\", \"Songti SC\", \"STSong\", \"SimSun\", \"Courier New\", monospace;\n}\nbutton, input, textarea, select { font: inherit; color: inherit; }\nbutton { cursor: pointer; border: 0; background: none; padding: 0; }\n:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }\n::selection { background: var(--selection); }\n.tnum { font-variant-numeric: tabular-nums; }\n\n/* ── Window chrome: mac / win, switched by the layer switcher via postMessage ── */\n.win { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--desk); }\n.titlebar {\n  height: 38px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 12px;\n  background: var(--chrome); border-bottom: 1px solid var(--line); user-select: none;\n  font-size: 12px; color: var(--ink-3);\n}\n.titlebar .title { flex: 1; text-align: center; font-weight: 500; color: var(--ink-2); }\n.lights { display: flex; gap: 8px; }\n.lights i { width: 12px; height: 12px; border-radius: 50%; display: block; }\n.lights i:nth-child(1) { background: #ff5f57; } .lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }\n.wincaps { display: none; margin-right: -12px; }\n.wincaps span { width: 46px; height: 38px; display: grid; place-items: center; color: var(--ink-2); font-size: 13px; }\nbody[data-os=\"win\"] .lights { display: none; }\nbody[data-os=\"win\"] .wincaps { display: flex; }\nbody[data-os=\"win\"] .titlebar .title { text-align: left; padding-left: 4px; }\n.app { flex: 1; min-height: 0; display: flex; }\n\n/* ── Primitives ── */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  height: 34px; padding: 0 14px; border-radius: var(--r-ctl); font-weight: 500; white-space: nowrap;\n  transition: transform 160ms var(--ease-out), background-color 160ms ease, box-shadow 160ms ease;\n}\n.btn:active { transform: scale(0.97); }\n.btn-primary { background: var(--accent); color: var(--on-accent); }\n.btn-ghost { background: transparent; color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line-strong); }\n.btn-quiet { background: var(--hover); color: var(--ink-2); }\n@media (hover: hover) and (pointer: fine) {\n  .btn-primary:hover { background: var(--accent-hover); }\n  .btn-ghost:hover, .btn-quiet:hover { background: var(--hover-strong); }\n}\n.btn[disabled] { opacity: .45; pointer-events: none; }\n.input {\n  width: 100%; height: 40px; padding: 0 12px; border-radius: var(--r-ctl);\n  background: var(--field); border: 1px solid var(--line-strong); font-size: 16px;\n  transition: border-color 160ms ease, box-shadow 160ms ease;\n}\n.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }\n.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12px; background: var(--hover); color: var(--ink-2); }\n.kbd { font-family: var(--font-mono); font-size: 11px; padding: 1px 6px; border-radius: 4px; box-shadow: inset 0 0 0 1px var(--line-strong); color: var(--ink-3); }\n.muted { color: var(--ink-3); }\n.eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }\n.spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line-strong); border-top-color: var(--accent); animation: spin 600ms linear infinite; flex: none; }\n@keyframes spin { to { transform: rotate(360deg); } }\n.ok { width: 14px; height: 14px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; font-size: 9px; flex: none; }\n\n/* Enter animations use @starting-style so they need no JS mount flags. */\n.enter { transition: opacity 220ms var(--ease-out), transform 220ms var(--ease-out); }\n@starting-style { .enter { opacity: 0; transform: translateY(6px); } }\n\n/* Modal: centered, scales from .96 (never from 0). */\n.scrim { position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: center; z-index: 50;\n  opacity: 0; pointer-events: none; transition: opacity 200ms ease; }\n.scrim.open { opacity: 1; pointer-events: auto; }\n.modal { background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow-pop); width: min(560px, calc(100vw - 32px));\n  transform: scale(.96); opacity: 0; transition: transform 240ms var(--ease-out), opacity 200ms var(--ease-out); }\n.scrim.open .modal { transform: none; opacity: 1; }\n\n/* Toast: enters and exits from the bottom, the same direction. */\n.toast { position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 140%); opacity: 0; z-index: 60;\n  background: var(--toast); color: var(--on-toast); padding: 10px 14px; border-radius: 12px; box-shadow: var(--shadow-pop);\n  display: flex; gap: 10px; align-items: center; font-size: 13px; transition: transform 300ms var(--ease-out), opacity 200ms ease; }\n.toast.show { transform: translate(-50%, 0); opacity: 1; }\n\n/* Script page typography shared by both directions. */\n.sc-heading { font-weight: 700; text-transform: uppercase; margin: 22px 0 8px; }\n.sc-action { margin: 0 0 10px; }\n.sc-char { margin: 14px 0 0 38%; text-transform: uppercase; }\n.sc-paren { margin: 0 0 0 31%; }\n.sc-dial { margin: 0 18% 8px 24%; }\n.sc-trans { text-align: right; margin: 14px 0; text-transform: uppercase; }\n.sc-node { border-radius: 4px; transition: background-color 400ms ease; }\n.sc-node.writing { background: var(--write-hl); }\n\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after { transition-duration: 1ms !important; animation-duration: 1ms !important; }\n  .spin { animation: none; }\n}\n\n/* Direction A · Studio Paper — warm paper, serif display, vermilion seal accent.\n   The AI sits in a right-hand column; the script page is the hero. */\n:root {\n  --font-ui: -apple-system, BlinkMacSystemFont, \"PingFang SC\", \"Segoe UI\", \"Microsoft YaHei\", sans-serif;\n  --font-display: \"Songti SC\", \"STSong\", \"Noto Serif SC\", \"SimSun\", Georgia, serif;\n  --desk: #efebe3; --chrome: #e8e3d9; --surface: #fbf9f4; --paper: #fffdf8; --field: #fffdf8;\n  --ink: #1d1b18; --ink-2: #4a4640; --ink-3: #8a847a;\n  --line: #e2dccf; --line-strong: #d3cbbb;\n  --hover: #ece6da; --hover-strong: #e3dccd;\n  --accent: #b23a1d; --accent-hover: #9c321a; --on-accent: #fff8f2; --accent-ring: rgba(178,58,29,.18); --accent-soft: #f6e3da;\n  --ok: #3f7d4e; --selection: #f2d6c9; --write-hl: #fbe9c8;\n  --scrim: rgba(40, 32, 20, .28); --toast: #2a2622; --on-toast: #f5f1ea;\n  --r-ctl: 8px; --r-card: 14px;\n  --shadow-card: 0 1px 0 rgba(60,45,20,.04), 0 1px 3px rgba(60,45,20,.06);\n  --shadow-paper: 0 1px 2px rgba(60,45,20,.06), 0 8px 28px rgba(60,45,20,.08);\n  --shadow-pop: 0 12px 40px rgba(40,30,15,.18), 0 2px 6px rgba(40,30,15,.08);\n}\n.display { font-family: var(--font-display); font-weight: 600; letter-spacing: .01em; }\n.seal { width: 26px; height: 26px; border-radius: 6px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 14px; }\n.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; }\n\n/* App frame */\n.nav { width: 220px; flex: none; background: var(--chrome); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 14px 10px; gap: 2px; }\n.nav a { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-radius: 7px; color: var(--ink-2); text-decoration: none; cursor: default; }\n.nav a.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-card); font-weight: 500; }\n.nav .grow { flex: 1; }\n.nav .group { margin: 14px 10px 4px; }\n.main { flex: 1; min-width: 0; overflow: auto; }\n.card { background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow-card); border: 1px solid var(--line); }\n\n/* Workspace */\n.ws-left { width: 230px; flex: none; border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; overflow: auto; }\n.ws-left .sec { padding: 12px 12px 6px; }\n.ws-left .item { display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 30px; padding: 0 10px; border-radius: 7px; color: var(--ink-2); font-size: 13px; }\n.ws-left .item.on { background: var(--hover); color: var(--ink); font-weight: 500; }\n.ws-left .item small { color: var(--ink-3); font-size: 11px; }\n.ws-center { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--desk); }\n.ws-toolbar { height: 46px; flex: none; display: flex; align-items: center; justify-content: center; gap: 2px; border-bottom: 1px solid var(--line); background: var(--surface); }\n.ws-toolbar button { height: 30px; padding: 0 10px; border-radius: 6px; font-size: 12px; color: var(--ink-2); transition: transform 160ms var(--ease-out); }\n.ws-toolbar button:active { transform: scale(.97); }\n.ws-toolbar button.on { background: var(--hover-strong); color: var(--ink); }\n.ws-scroll { flex: 1; overflow: auto; padding: 28px 0 80px; }\n.page { width: min(640px, calc(100% - 48px)); margin: 0 auto; background: var(--paper); box-shadow: var(--shadow-paper); padding: 56px 64px; font-family: var(--font-script); font-size: 14px; line-height: 1.65; min-height: 860px; border-radius: 2px; }\n.ws-right { width: 360px; flex: none; border-left: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; }\n.ai-head { height: 46px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 14px; border-bottom: 1px solid var(--line); }\n.ai-body { flex: 1; overflow: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }\n.ai-foot { padding: 12px; border-top: 1px solid var(--line); }\n.composer { border: 1px solid var(--line-strong); border-radius: 12px; background: var(--paper); padding: 10px; }\n.composer textarea { width: 100%; border: 0; resize: none; background: transparent; outline: none; font-size: 14px; min-height: 44px; }\n.msg-user { margin-left: auto; width: fit-content; max-width: 85%; background: var(--accent-soft); padding: 8px 12px; border-radius: 12px 12px 4px 12px; }\n.tool { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); padding: 7px 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--paper); }\n.tool b { font-weight: 500; color: var(--ink); ize: 14px;\n  line-height: 1.5;\n  color: var(--ink);\n  background: var(--desk);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  text-rendering: optimizeLegibility;\n  overflow: hidden;\n}\n:root {\n  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);\n  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);\n  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);\n  --font-mono: \"Courier Prime\", \"Courier New\", ui-monospace, monospace;\n  --font-script: \"Courier Prime\", \"Songti SC\", \"STSong\", \"SimSun\", \"Courier New\", monospace;\n}\nbutton, input, textarea, select { font: inherit; color: inherit; }\nbutton { cursor: pointer; border: 0; background: none; padding: 0; }\n:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }\n::selection { background: var(--selection); }\n.tnum { font-variant-numeric: tabular-nums; }\n\n/* ── Window chrome: mac / win, switched by the layer switcher via postMessage ── */\n.win { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--desk); }\n.titlebar {\n  height: 38px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 12px;\n  background: var(--chrome); border-bottom: 1px solid var(--line); user-select: none;\n  font-size: 12px; color: var(--ink-3);\n}\n.titlebar .title { flex: 1; text-align: center; font-weight: 500; color: var(--ink-2); }\n.lights { display: flex; gap: 8px; }\n.lights i { width: 12px; height: 12px; border-radius: 50%; display: block; }\n.lights i:nth-child(1) { background: #ff5f57; } .lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }\n.wincaps { display: none; margin-right: -12px; }\n.wincaps span { width: 46px; height: 38px; display: grid; place-items: center; color: var(--ink-2); font-size: 13px; }\nbody[data-os=\"win\"] .lights { display: none; }\nbody[data-os=\"win\"] .wincaps { display: flex; }\nbody[data-os=\"win\"] .titlebar .title { text-align: left; und: #28c840; }\n.wincaps { display: none; margin-right: -12px; }\n.wincaps span { width: 46px; height: 38px; display: grid; place-items: center; color: var(--ink-2); font-size: 13px; }\nbody[data-os=\"win\"] .lights { display: none; }\nbody[data-os=\"win\"] .wincaps { display: flex; }\nbody[data-os=\"win\"] .titlebar .title { text-align: left; padding-left: 4px; }\n.app { flex: 1; min-height: 0; display: flex; }\n\n/* ── Primitives ── */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  height: 34px; padding: 0 14px; border-radius: var(--r-ctl); font-weight: 500; white-space: nowrap;\n  transition: transform 160ms var(--ease-out), background-color 160ms ease, box-shadow 160ms ease;\n}\n.btn:active { transform: scale(0.97); }\n.btn-primary { background: var(--accent); color: var(--on-accent); }\n.btn-ghost { background: transparent; color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line-strong); }\n.btn-quiet { background: var(--hover); color: var(--ink-2); }\n@media (hover: hover) and (pointer: fine) {\n  .btn-primary:hover { background: var(--accent-hover); }\n  .btn-ghost:hover, .btn-quiet:hover { background: var(--hover-strong); }\n}\n.btn[disabled] { opacity: .45; pointer-events: none; }\n.input {\n  width: 100%; height: 40px; padding: 0 12px; border-radius: var(--r-ctl);\n  background: var(--field); border: 1px solid var(--line-strong); font-size: 16px;\n  transition: border-color 160ms ease, box-shadow 160ms ease;\n}\n.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }\n.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12px; background: var(--hover); color: var(--ink-2); }\n.kbd { font-family: var(--font-mono); font-size: 11px; padding: 1px 6px; border-radius: 4px; box-shadow: inset 0 0 0 1px var(--line-strong); color: var(--ink-3); }\n.muted { color: var(--ink-3); }\n.eyebrow { font-size: -items: center; gap: 8px; font-weight: 600; }\n\n/* App frame */\n.nav { width: 220px; flex: none; background: var(--chrome); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 14px 10px; gap: 2px; }\n.nav a { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-radius: 7px; color: var(--ink-2); text-decoration: none; cursor: default; }\n.nav a.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-card); font-weight: 500; }\n.nav .grow { flex: 1; }\n.nav .group { margin: 14px 10px 4px; }\n.main { flex: 1; min-width: 0; overflow: auto; }\n.card { background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow-card); border: 1px solid var(--line); }\n\n/* Workspace */\n.ws-left { width: 230px; flex: none; border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; overflow: auto; }\n.ws-left .sec { padding: 12px 12px 6px; }\n.ws-left .item { display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 30px; padding: 0 10px; border-radius: 7px; color: var(--ink-2); font-size: 13px; }\n.ws-left .item.on { background: var(--hover); color: var(--ink); font-weight: 500; }\n.ws-left .item small { color: var(--ink-3); font-size: 11px; }\n.ws-center { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--desk); }\n.ws-toolbar { height: 46px; flex: none; display: flex; align-items: center; justify-content: center; gap: 2px; border-bottom: 1px solid var(--line); background: var(--surface); }\n.ws-toolbar button { height: 30px; padding: 0 10px; border-radius: 6px; font-size: 12px; color: var(--ink-2); transition: transform 160ms var(--ease-out); }\n.ws-toolbar button:active { transform: scale(.97); }\n.ws-toolbar button.on { background: var(--hover-strong); color: var(--ink); }\n.ws-scroll { flex: 1; overflow: auto; padding: 28px 0 80px; }\n.page { width: min(640px, calc(100% - 48px)); margin: 0 auto; background: var(--paper); box-shadow: var(--shadow-paper); padding: 56px 64px; font-family: var(--font-script); font-size: 14px; line-height: 1.65; min-height: 860px; border-radius: 2px; }\n.ws-right { width: 360px; flex: none; border-left: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; }\n.ai-head { height: 46px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 14px; border-bottom: 1px solid var(--line); }\n.ai-body { flex: 1; overflow: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }\n.ai-foot { padding: 12px; border-top: 1px solid var(--line); }\n.composer { border: 1px solid var(--line-strong); border-radius: 12px; background: var(--paper); padding: 10px; }\n.composer textarea { width: 100%; border: 0; resize: none; background: transparent; outline: none; font-size: 14px; min-height: 44px; }\n.msg-user { margin-left: auto; width: fit-content; max-width: 85%; background: var(--accent-soft); padding: 8px 12px; border-radius: 12px 12px 4px 12px; }\n.tool { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); padding: 7px 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--paper); }\n.tool b { font-weight: 500; color: var(--ink); }\n.narr { font-size: 13px; color: var(--ink-2); }\n.turn-bar { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; padding: 8px 10px; border-radius: 9px; background: var(--hover); }\n<\/style>\n<\/head>\n<body>\n<style>\n.stagebar{display:flex;align-items:center;flex-wrap:wrap;gap:6px;row-gap:8px;font-size:12.5px}\n.st{display:inline-flex;align-items:center;gap:6px;color:var(--ink-3);white-space:nowrap}\n.st i{font-style:normal;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;box-shadow:inset 0 0 0 1px var(--line-strong)}\n.st.done{color:var(--ink-2)} .st.done svg{color:var(--ok)}\n.st.cur{color:var(--ink);font-weight:600} .st.cur i{background:var(--accent);color:var(--on-accent);box-shadow:none}\n.st-line{width:18px;height:1px;background:var(--line-strong)}\n.meter .bar{height:4px;border-radius:2px;background:var(--hover-strong);margin-top:5px}\n.meter .bar i{display:block;height:100%;border-radius:2px;background:var(--accent)}\n.rule{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-size:13px}\n.rule .meta{font-size:11.5px;color:var(--ink-3);margin-top:4px}\n.opt{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--line-strong);cursor:pointer;transition:box-shadow 160ms ease,transform 160ms var(--ease-out)}\n.opt:active{transform:scale(.98)} .opt.on{box-shadow:inset 0 0 0 2px var(--accent)}\n.lock{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;padding:8px 10px;border-radius:9px;background:var(--hover)}\n.lock svg{flex:none;margin-top:2px;color:var(--accent)}\n.cite{padding:10px 12px;border-radius:10px;background:var(--paper);border:1px solid var(--line)}\n<\/style>\n\n<div class=\"win\">\n  <div class=\"titlebar\"><div class=\"lights\"><i><\/i><i><\/i><i><\/i><\/div><div class=\"title\">胡同小神仙 — 故事工坊<\/div>\n    <div class=\"wincaps\"><span>—<\/span><span>☐<\/span><span>✕<\/span><\/div><\/div>\n  <div class=\"app\"><nav class=\"nav\"><div class=\"brand\" style=\"padding:4px 10px 14px\"><div class=\"seal\">神<\/div>胡同小神仙<\/div>\n  <a class=\"\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14ZM20 17v4H6.5\"/><\/svg> 项目圣经<\/a><a class=\"\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M22 12h-6l-2 3h-4l-2-3H2M5.5 5h13L22 12v7H2v-7Z\"/><\/svg> 选题池<\/a><a class=\"on\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 2 2 7l10 5 10-5ZM2 17l10 5 10-5M2 12l10 5 10-5\"/><\/svg> 故事工坊<\/a><a class=\"\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 9h12v12H9ZM5 15H3V3h12v2\"/><\/svg> 结构复刻<\/a><a class=\"\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z\"/><\/svg> 剧本<\/a><a class=\"\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 22V4s1-1 4-1 5 2 8 2 4-1 4-1v11s-1 1-4 1-5-2-8-2-4 1-4 1\"/><\/svg> 审稿与规则<\/a><a class=\"\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18ZM3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18\"/><\/svg> 资料台<\/a><div class=\"grow\"><\/div>\n  <a><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1\"/><\/svg> 团队与设备<\/a><\/nav>\n  <main class=\"main\" style=\"padding:24px 32px\">\n    <div style=\"display:flex;align-items:center;gap:16px;margin-bottom:6px\"><div class=\"stagebar\"><span class=\"st done\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg>选题<\/span><span class=\"st-line\"><\/span><span class=\"st cur\"><i>2<\/i>故事<\/span><span class=\"st-line\"><\/span><span class=\"st \"><i>3<\/i>大纲<\/span><span class=\"st-line\"><\/span><span class=\"st \"><i>4<\/i>分场<\/span><span class=\"st-line\"><\/span><span class=\"st \"><i>5<\/i>剧本<\/span><\/div><span style=\"flex:1\"><\/span><button class=\"btn btn-ghost\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 9h12v12H9ZM5 15H3V3h12v2\"/><\/svg> 用结构模型生成<\/button><\/div>\n    <h1 class=\"display\" style=\"font-size:24px;margin:18px 0 4px\">「全班比谁的球鞋贵」· 三个不同走向<\/h1>\n    <p class=\"muted\" style=\"margin:0 0 18px\">三个走向的冲突来源和解决方式都不一样，避免\"看一个和看十个没区别\"。每个约 500 字，起承转合完整。<\/p>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr) 260px;gap:16px;align-items:start\"><article class=\"card cand enter\" style=\"padding:16px;display:flex;flex-direction:column;gap:10px\">\n  <div style=\"display:flex;align-items:center;gap:8px\"><span class=\"chip\" style=\"height:22px\">走向 A<\/span><b style=\"flex:1;font-size:16px\">借来的鞋<\/b><\/div>\n  <p style=\"margin:0;font-size:13.5px;line-height:1.7;color:var(--ink-2)\">门墩儿借来一双会自己跑的旧球鞋。豆豆赢了五十米跑，却怎么也停不下来，被鞋拖着跑遍胡同。最后姥爷认出这是他年轻时的鞋——它只是想再跑一次。豆豆光着脚走回家，第一次觉得旧鞋挺好。<\/p>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px\"><div><span class=\"muted\">结构<\/span><br>A1 捷径道具反噬<\/div><div><span class=\"muted\">笑点机制<\/span><br>道具规则被字面执行<\/div><\/div>\n  <div class=\"meter\"><div style=\"display:flex;justify-content:space-between;font-size:12px\"><span class=\"muted\">字数<\/span><span class=\"tnum\" style=\"\">486 / 500 字<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:97.2%\"><\/i><\/div><\/div>\n  <div style=\"display:flex;gap:6px\"><button class=\"btn btn-primary\" style=\"height:30px;flex:1\" data-t=\"借来的鞋\" onclick=\"choose(this)\">选这个<\/button><button class=\"btn btn-ghost\" style=\"height:30px\" onclick=\"regen(this)\">换一个<\/button><\/div><\/article><article class=\"card cand enter\" style=\"padding:16px;display:flex;flex-direction:column;gap:10px\">\n  <div style=\"display:flex;align-items:center;gap:8px\"><span class=\"chip\" style=\"height:22px\">走向 B<\/span><b style=\"flex:1;font-size:16px\">修鞋摊的一天<\/b><\/div>\n  <p style=\"margin:0;font-size:13.5px;line-height:1.7;color:var(--ink-2)\">豆豆被罚去姥爷的修车铺帮一天忙。来修鞋的人有送外卖的叔叔、跳广场舞的奶奶、刚毕业的大姐姐，每双鞋都有自己的路。豆豆把\"想要新鞋\"的作文改成了\"鞋会记住路\"。<\/p>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px\"><div><span class=\"muted\">结构<\/span><br>B1 一日体验<\/div><div><span class=\"muted\">笑点机制<\/span><br>旁观者视角的反差<\/div><\/div>\n  <div class=\"meter\"><div style=\"display:flex;justify-content:space-between;font-size:12px\"><span class=\"muted\">字数<\/span><span class=\"tnum\" style=\"\">452 / 500 字<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:90.4%\"><\/i><\/div><\/div>\n  <div style=\"display:flex;gap:6px\"><button class=\"btn btn-primary\" style=\"height:30px;flex:1\" data-t=\"修鞋摊的一天\" onclick=\"choose(this)\">选这个<\/button><button class=\"btn btn-ghost\" style=\"height:30px\" onclick=\"regen(this)\">换一个<\/button><\/div><\/article><article class=\"card cand enter\" style=\"padding:16px;display:flex;flex-direction:column;gap:10px\">\n  <div style=\"display:flex;align-items:center;gap:8px\"><span class=\"chip\" style=\"height:22px\">走向 C<\/span><b style=\"flex:1;font-size:16px\">一只鞋的旅行<\/b><\/div>\n  <p style=\"margin:0;font-size:13.5px;line-height:1.7;color:var(--ink-2)\">豆豆的旧鞋被门墩儿施法开口说话，非要讲它这两年跟着豆豆去过的地方：第一次上学、摔破膝盖、陪姥爷排队挂号……豆豆发现，比鞋贵不贵更重要的是它陪他走过哪儿。<\/p>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px\"><div><span class=\"muted\">结构<\/span><br>C3 物件回望<\/div><div><span class=\"muted\">笑点机制<\/span><br>物件拟人吐槽<\/div><\/div>\n  <div class=\"meter\"><div style=\"display:flex;justify-content:space-between;font-size:12px\"><span class=\"muted\">字数<\/span><span class=\"tnum\" style=\"\">471 / 500 字<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:94.19999999999999%\"><\/i><\/div><\/div>\n  <div style=\"display:flex;gap:6px\"><button class=\"btn btn-primary\" style=\"height:30px;flex:1\" data-t=\"一只鞋的旅行\" onclick=\"choose(this)\">选这个<\/button><button class=\"btn btn-ghost\" style=\"height:30px\" onclick=\"regen(this)\">换一个<\/button><\/div><\/article>\n      <aside class=\"card\" style=\"padding:14px;display:flex;flex-direction:column;gap:8px\"><div class=\"eyebrow\" style=\"margin:4px 0 6px\">选定后会锁定，下游扩写不能改<\/div>\n  <div class=\"lock\"><svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 11h14v10H5ZM8 11V7a4 4 0 0 1 8 0v4\"/><\/svg><div><b>故事核心<\/b><br>鞋是用来走路的，不是用来比的<\/div><\/div>\n  <div class=\"lock\"><svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 11h14v10H5ZM8 11V7a4 4 0 0 1 8 0v4\"/><\/svg><div><b>重场戏<\/b><br>姥爷认出这双鞋是他年轻时的<\/div><\/div>\n  <div class=\"lock\"><svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 11h14v10H5ZM8 11V7a4 4 0 0 1 8 0v4\"/><\/svg><div><b>人物动机<\/b><br>豆豆不是虚荣，是怕被同学看不起<\/div><\/div><div style=\"height:1px;background:var(--line);margin:6px 0\"><\/div>\n        <div class=\"eyebrow\">本次读取<\/div><div class=\"muted\" style=\"font-size:12px\">项目圣经 7 条 · 导演规则 12 条 · 范例 3 份 · 反例 4 条<\/div><\/aside><\/div>\n  <\/main><script>function choose(b){document.querySelectorAll('.cand').forEach(c=>c.classList.remove('chosen'));b.closest('.cand').classList.add('chosen');toast('已选「'+b.dataset.t+'」 · 锁定故事核心后进入大纲');}\nasync function regen(b){const c=b.closest('.cand');c.style.opacity=.4;await wait(700);c.style.opacity=1;toast('已换一个走向 · 和其他两个的冲突来源不重复');}<\/script>\n<style>.cand{transition:opacity 200ms ease}.cand.chosen{box-shadow:inset 0 0 0 2px var(--accent)}<\/style><\/div>\n<\/div>\n<div class=\"toast\" id=\"toast\"><span><\/span><\/div>\n<script>// Shared runtime injected into every layer document.\n(function () {\n  // The parent switcher tells each layer which OS chrome to draw.\n  window.addEventListener('message', function (e) {\n    if (e.data && e.data.type === 'proto:os') document.body.dataset.os = e.data.os;\n  });\n  var os = new URLSearchParams(location.hash.slice(1)).get('os');\n  document.body.dataset.os = os || 'mac';\n\n  var toastTimer;\n  window.toast = function (text) {\n    var el = document.getElementById('toast');\n    if (!el) return;\n    el.querySelector('span').textContent = text;\n    el.classList.add('show');\n    clearTimeout(toastTimer);\n    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2600);\n  };\n  window.wait = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };\n  window.openModal = function (id) { document.getElementById(id).classList.add('open'); };\n  window.closeModal = function (id) { document.getElementById(id).classList.remove('open'); };\n  document.addEventListener('keydown', function (e) {\n    if (e.key === 'Escape') document.querySelectorAll('.scrim.open').forEach(function (s) { s.classList.remove('open'); });\n  });\n})();\n<\/script>\n<\/body>\n<\/html>","p4-b":"<!doctype html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>故事工坊 · 多走向 · B · Night Desk<\/title>\n<style>/* Shared base for every layer. Direction themes only override tokens + layout. */\n*, *::before, *::after { box-sizing: border-box; }\nhtml, body { margin: 0; height: 100%; }\nbody {\n  font-family: var(--font-ui);\n  font-size: 14px;\n  line-height: 1.5;\n  color: var(--ink);\n  background: var(--desk);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  text-rendering: optimizeLegibility;\n  overflow: hidden;\n}\n:root {\n  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);\n  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);\n  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);\n  --font-mono: \"Courier Prime\", \"Courier New\", ui-monospace, monospace;\n  --font-script: \"Courier Prime\", \"Songti SC\", \"STSong\", \"SimSun\", \"Courier New\", monospace;\n}\nbutton, input, textarea, select { font: inherit; color: inherit; }\nbutton { cursor: pointer; border: 0; background: none; padding: 0; }\n:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }\n::selection { background: var(--selection); }\n.tnum { font-variant-numeric: tabular-nums; }\n\n/* ── Window chrome: mac / win, switched by the layer switcher via postMessage ── */\n.win { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--desk); }\n.titlebar {\n  height: 38px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 12px;\n  background: var(--chrome); border-bottom: 1px solid var(--line); user-select: none;\n  font-size: 12px; color: var(--ink-3);\n}\n.titlebar .title { flex: 1; text-align: center; font-weight: 500; color: var(--ink-2); }\n.lights { display: flex; gap: 8px; }\n.lights i { width: 12px; height: 12px; border-radius: 50%; display: block; }\n.lights i:nth-child(1) { background: #ff5f57; } .lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }\n.wincaps { display: none; margin-right: -12px; }\n.wincaps span { width: 46px; height: 38px; display: grid; place-items: center; color: var(--ink-2); font-size: 13px; }\nbody[data-os=\"win\"] .lights { display: none; }\nbody[data-os=\"win\"] .wincaps { display: flex; }\nbody[data-os=\"win\"] .titlebar .title { text-align: left; padding-left: 4px; }\n.app { flex: 1; min-height: 0; display: flex; }\n\n/* ── Primitives ── */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  height: 34px; padding: 0 14px; border-radius: var(--r-ctl); font-weight: 500; white-space: nowrap;\n  transition: transform 160ms var(--ease-out), background-color 160ms ease, box-shadow 160ms ease;\n}\n.btn:active { transform: scale(0.97); }\n.btn-primary { background: var(--accent); color: var(--on-accent); }\n.btn-ghost { background: transparent; color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line-strong); }\n.btn-quiet { background: var(--hover); color: var(--ink-2); }\n@media (hover: hover) and (pointer: fine) {\n  .btn-primary:hover { background: var(--accent-hover); }\n  .btn-ghost:hover, .btn-quiet:hover { background: var(--hover-strong); }\n}\n.btn[disabled] { opacity: .45; pointer-events: none; }\n.input {\n  width: 100%; height: 40px; padding: 0 12px; border-radius: var(--r-ctl);\n  background: var(--field); border: 1px solid var(--line-strong); font-size: 16px;\n  transition: border-color 160ms ease, box-shadow 160ms ease;\n}\n.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }\n.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12px; background: var(--hover); color: var(--ink-2); }\n.kbd { font-family: var(--font-mono); font-size: 11px; padding: 1px 6px; border-radius: 4px; box-shadow: inset 0 0 0 1px var(--line-strong); color: var(--ink-3); }\n.muted { color: var(--ink-3); }\n.eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }\n.spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line-strong); border-top-color: var(--accent); animation: spin 600ms linear infinite; flex: none; }\n@keyframes spin { to { transform: rotate(360deg); } }\n.ok { width: 14px; height: 14px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; font-size: 9px; flex: none; }\n\n/* Enter animations use @starting-style so they need no JS mount flags. */\n.enter { transition: opacity 220ms var(--ease-out), transform 220ms var(--ease-out); }\n@starting-style { .enter { opacity: 0; transform: translateY(6px); } }\n\n/* Modal: centered, scales from .96 (never from 0). */\n.scrim { position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: center; z-index: 50;\n  opacity: 0; pointer-events: none; transition: opacity 200ms ease; }\n.scrim.open { opacity: 1; pointer-events: auto; }\n.modal { background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow-pop); width: min(560px, calc(100vw - 32px));\n  transform: scale(.96); opacity: 0; transition: transform 240ms var(--ease-out), opacity 200ms var(--ease-out); }\n.scrim.open .modal { transform: none; opacity: 1; }\n\n/* Toast: enters and exits from the bottom, the same direction. */\n.toast { position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 140%); opacity: 0; z-index: 60;\n  background: var(--toast); color: var(--on-toast); padding: 10px 14px; border-radius: 12px; box-shadow: var(--shadow-pop);\n  display: flex; gap: 10px; align-items: center; font-size: 13px; transition: transform 300ms var(--ease-out), opacity 200ms ease; }\n.toast.show { transform: translate(-50%, 0); opacity: 1; }\n\n/* Script page typography shared by both directions. */\n.sc-heading { font-weight: 700; text-transform: uppercase; margin: 22px 0 8px; }\n.sc-action { margin: 0 0 10px; }\n.sc-char { margin: 14px 0 0 38%; text-transform: uppercase; }\n.sc-paren { margin: 0 0 0 31%; }\n.sc-dial { margin: 0 18% 8px 24%; }\n.sc-trans { text-align: right; margin: 14px 0; text-transform: uppercase; }\n.sc-node { border-radius: 4px; transition: background-color 400ms ease; }\n.sc-node.writing { background: var(--write-hl); }\n\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after { transition-duration: 1ms !important; animation-duration: 1ms !important; }\n  .spin { animation: none; }\n}\n\n/* Direction B · Night Desk — dark, immersive focus mode. AI lives in a floating\n   command bar (⌘K) and writes proposals inline that the writer accepts or rejects. */\n:root {\n  --font-ui: \"Inter\", -apple-system, BlinkMacSystemFont, \"PingFang SC\", \"Segoe UI\", \"Microsoft YaHei\", sans-serif;\n  --font-display: \"Inter\", -apple-system, \"PingFang SC\", \"Microsoft YaHei\", sans-serif;\n  --desk: #0d0e11; --chrome: #0a0b0d; --surface: #15171c; --paper: #121419; --field: #1a1d23;\n  --ink: #ecedf0; --ink-2: #b4b7c0; --ink-3: #737782;\n  --line: #22252c; --line-strong: #2e323a;\n  --hover: #1d2027; --hover-strong: #262a32;\n  --accent: #9aa8ff; --accent-hover: #b0bbff; --on-accent: #0d0e11; --accent-ring: rgba(154,168,255,.25); --accent-soft: rgba(154,168,255,.12);\n  --amber: #f2b45c; --amber-soft: rgba(242,180,92,.10);\n  --ok: #4fb57a; --selection: rgba(154,168,255,.3); --write-hl: rgba(242,180,92,.10);\n  --scrim: rgba(0,0,0,.55); --toast: #ecedf0; --on-toast: #111;\n  --r-ctl: 9px; --r-card: 16px;\n  --shadow-card: 0 0 0 1px var(--line);\n  --shadow-pop: 0 0 0 1px var(--line-strong), 0 24px 60px rgba(0,0,0,.55);\n}\nbody { color-scheme: dark; }\n.display { font-family: var(--font-display); font-weight: 600; letter-spacing: -.02em; }\n.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; letter-spacing: -.01em; }\n.mark { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg, var(--accent), #c9a3ff); }\n\n.rail { width: 56px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 0; border-right: 1px solid var(--line); background: var(--chrome); }\n.rail button { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; color: var(--ink-3); transition: transform 160ms var(--ease-out); }\n.rail button:active { transform: scale(.95); }\n.rail button.on { background: var(--hover-strong); color: var(--ink); }\n.rail .grow { flex: 1; }\n.main { flex: 1; min-width: 0; overflow: auto; }\n.card { background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow-card); }\n\n/* Workspace: scene rail + focused page + floating command bar */\n.scene-rail { width: 210px; flex: none; padding: 16px 10px; overflow: auto; border-right: 1px solid var(--line); }\n.scene-rail .s { display: block; padding: 8px 10px; border-radius: 8px; color: var(--ink-3); font-size: 12.5px; }\n.scene-rail .s b { display: block; color: var(--ink-2); font-weight: 500; font-size: 13px; }\n.scene-rail .s.on { background: var(--hover); }\n.scene-rail .s.on b { color: var(--ink); }\n.focus { flex: 1; min-width: 0; position: relative; display: flex; flex-direction: column; }\n.focus-top { height: 44px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 16px; color: var(--ink-3); font-size: 12.5px; }\n.focus-scroll { flex: 1; overflow: auto; padding: 8px 0 160px; }\n.page { width: min(640px, calc(100% - 48px)); margin: 0 auto; font-family: var(--font-script); font-size: 14.5px; line-height: 1.7; color: var(--ink-2); }\n.page .sc-heading, .page .sc-char { color: var(--ink); }\n.cmdbar { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); width: min(620px, calc(100% - 40px));\n  background: rgba(26,29,35,.92); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);\n  border-radius: 14px; box-shadow: var(--shadow-pop); padding: 8px; }\n.cmdbar .row { display: flex; align-items: center; gap: 8px; }\n.cmdbar input { flex: 1; height: 38px; background: transparent; border: 0; outline: none; padding: 0 8px; font-size: 15px; }\n.agent-pill { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow-pop); font-size: 12.5px; color: var(--ink-2);\n  opacity: 0; transform: translate(-50%, -6px); transition: opacity 200ms var(--ease-out), transform 200ms var(--ease-out); pointer-events: none; }\n.agent-pill.show { opacity: 1; transform: translate(-50%, 0); }\n.proposal { border-left: 2px solid var(--amber); background: var(--amber-soft); padding: 6px 12px; margin: 10px -14px; border-radius: 0 8px 8px 0; }\n.proposal-bar { display: flex; gap: 6px; justify-content: flex-end; margin-top: 6px; font-family: var(--font-ui); }\n.inspector { width: 300px; flex: none; border-left: 1px solid var(--line); padding: 16px; overflow: auto; display: flex; flex-direction: column; gap: 10px; }\n.step { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); }\n.step.wait { color: var(--ink-3); }\n<\/style>\n<\/head>\n<body>\n<style>\n.stagebar{display:flex;align-items:center;flex-wrap:wrap;gap:6px;row-gap:8px;font-size:12.5px}\n.st{display:inline-flex;align-items:center;gap:6px;color:var(--ink-3);white-space:nowrap}\n.st i{font-style:normal;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;box-shadow:inset 0 0 0 1px var(--line-strong)}\n.st.done{color:var(--ink-2)} .st.done svg{color:var(--ok)}\n.st.cur{color:var(--ink);font-weight:600} .st.cur i{background:var(--accent);color:var(--on-accent);box-shadow:none}\n.st-line{width:18px;height:1px;background:var(--line-strong)}\n.meter .bar{height:4px;border-radius:2px;background:var(--hover-strong);margin-top:5px}\n.meter .bar i{display:block;height:100%;border-radius:2px;background:var(--accent)}\n.rule{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-size:13px}\n.rule .meta{font-size:11.5px;color:var(--ink-3);margin-top:4px}\n.opt{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--line-strong);cursor:pointer;transition:box-shadow 160ms ease,transform 160ms var(--ease-out)}\n.opt:active{transform:scale(.98)} .opt.on{box-shadow:inset 0 0 0 2px var(--accent)}\n.lock{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;padding:8px 10px;border-radius:9px;background:var(--hover)}\n.lock svg{flex:none;margin-top:2px;color:var(--accent)}\n.cite{padding:10px 12px;border-radius:10px;background:var(--paper);border:1px solid var(--line)}\n<\/style>\n\n<div class=\"win\">\n  <div class=\"titlebar\"><div class=\"lights\"><i><\/i><i><\/i><i><\/i><\/div><div class=\"title\">胡同小神仙 — 故事工坊<\/div>\n    <div class=\"wincaps\"><span>—<\/span><span>☐<\/span><span>✕<\/span><\/div><\/div>\n  <div class=\"app\"><nav class=\"rail\"><div class=\"mark\" style=\"margin-bottom:10px\"><\/div>\n  <button class=\"\" title=\"项目圣经\" aria-label=\"项目圣经\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14ZM20 17v4H6.5\"/><\/svg><\/button><button class=\"\" title=\"选题池\" aria-label=\"选题池\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M22 12h-6l-2 3h-4l-2-3H2M5.5 5h13L22 12v7H2v-7Z\"/><\/svg><\/button><button class=\"on\" title=\"故事工坊\" aria-label=\"故事工坊\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 2 2 7l10 5 10-5ZM2 17l10 5 10-5M2 12l10 5 10-5\"/><\/svg><\/button><button class=\"\" title=\"结构复刻\" aria-label=\"结构复刻\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 9h12v12H9ZM5 15H3V3h12v2\"/><\/svg><\/button><button class=\"\" title=\"剧本\" aria-label=\"剧本\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z\"/><\/svg><\/button><button class=\"\" title=\"审稿与规则\" aria-label=\"审稿与规则\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 22V4s1-1 4-1 5 2 8 2 4-1 4-1v11s-1 1-4 1-5-2-8-2-4 1-4 1\"/><\/svg><\/button><button class=\"\" title=\"资料台\" aria-label=\"资料台\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18ZM3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18\"/><\/svg><\/button>\n  <div class=\"grow\"><\/div><button title=\"团队与设备\" aria-label=\"团队与设备\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1\"/><\/svg><\/button><\/nav>\n  <main class=\"main\" style=\"display:grid;grid-template-columns:1fr 300px\">\n    <div style=\"padding:24px 32px;overflow:auto\"><div class=\"stagebar\"><span class=\"st done\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/><\/svg>选题<\/span><span class=\"st-line\"><\/span><span class=\"st cur\"><i>2<\/i>故事<\/span><span class=\"st-line\"><\/span><span class=\"st \"><i>3<\/i>大纲<\/span><span class=\"st-line\"><\/span><span class=\"st \"><i>4<\/i>分场<\/span><span class=\"st-line\"><\/span><span class=\"st \"><i>5<\/i>剧本<\/span><\/div>\n      <h1 class=\"display\" style=\"font-size:20px;margin:20px 0 14px\">三个走向 · 全班比谁的球鞋贵<\/h1>\n      <div style=\"display:flex;flex-direction:column;gap:12px\"><article class=\"card cand enter\" style=\"padding:16px;display:flex;flex-direction:column;gap:10px\">\n  <div style=\"display:flex;align-items:center;gap:8px\"><span class=\"chip\" style=\"height:22px\">走向 A<\/span><b style=\"flex:1;font-size:16px\">借来的鞋<\/b><\/div>\n  <p style=\"margin:0;font-size:13.5px;line-height:1.7;color:var(--ink-2)\">门墩儿借来一双会自己跑的旧球鞋。豆豆赢了五十米跑，却怎么也停不下来，被鞋拖着跑遍胡同。最后姥爷认出这是他年轻时的鞋——它只是想再跑一次。豆豆光着脚走回家，第一次觉得旧鞋挺好。<\/p>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px\"><div><span class=\"muted\">结构<\/span><br>A1 捷径道具反噬<\/div><div><span class=\"muted\">笑点机制<\/span><br>道具规则被字面执行<\/div><\/div>\n  <div class=\"meter\"><div style=\"display:flex;justify-content:space-between;font-size:12px\"><span class=\"muted\">字数<\/span><span class=\"tnum\" style=\"\">486 / 500 字<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:97.2%\"><\/i><\/div><\/div>\n  <div style=\"display:flex;gap:6px\"><button class=\"btn btn-primary\" style=\"height:30px;flex:1\" data-t=\"借来的鞋\" onclick=\"choose(this)\">选这个<\/button><button class=\"btn btn-ghost\" style=\"height:30px\" onclick=\"regen(this)\">换一个<\/button><\/div><\/article><article class=\"card cand enter\" style=\"padding:16px;display:flex;flex-direction:column;gap:10px\">\n  <div style=\"display:flex;align-items:center;gap:8px\"><span class=\"chip\" style=\"height:22px\">走向 B<\/span><b style=\"flex:1;font-size:16px\">修鞋摊的一天<\/b><\/div>\n  <p style=\"margin:0;font-size:13.5px;line-height:1.7;color:var(--ink-2)\">豆豆被罚去姥爷的修车铺帮一天忙。来修鞋的人有送外卖的叔叔、跳广场舞的奶奶、刚毕业的大姐姐，每双鞋都有自己的路。豆豆把\"想要新鞋\"的作文改成了\"鞋会记住路\"。<\/p>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px\"><div><span class=\"muted\">结构<\/span><br>B1 一日体验<\/div><div><span class=\"muted\">笑点机制<\/span><br>旁观者视角的反差<\/div><\/div>\n  <div class=\"meter\"><div style=\"display:flex;justify-content:space-between;font-size:12px\"><span class=\"muted\">字数<\/span><span class=\"tnum\" style=\"\">452 / 500 字<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:90.4%\"><\/i><\/div><\/div>\n  <div style=\"display:flex;gap:6px\"><button class=\"btn btn-primary\" style=\"height:30px;flex:1\" data-t=\"修鞋摊的一天\" onclick=\"choose(this)\">选这个<\/button><button class=\"btn btn-ghost\" style=\"height:30px\" onclick=\"regen(this)\">换一个<\/button><\/div><\/article><article class=\"card cand enter\" style=\"padding:16px;display:flex;flex-direction:column;gap:10px\">\n  <div style=\"display:flex;align-items:center;gap:8px\"><span class=\"chip\" style=\"height:22px\">走向 C<\/span><b style=\"flex:1;font-size:16px\">一只鞋的旅行<\/b><\/div>\n  <p style=\"margin:0;font-size:13.5px;line-height:1.7;color:var(--ink-2)\">豆豆的旧鞋被门墩儿施法开口说话，非要讲它这两年跟着豆豆去过的地方：第一次上学、摔破膝盖、陪姥爷排队挂号……豆豆发现，比鞋贵不贵更重要的是它陪他走过哪儿。<\/p>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px\"><div><span class=\"muted\">结构<\/span><br>C3 物件回望<\/div><div><span class=\"muted\">笑点机制<\/span><br>物件拟人吐槽<\/div><\/div>\n  <div class=\"meter\"><div style=\"display:flex;justify-content:space-between;font-size:12px\"><span class=\"muted\">字数<\/span><span class=\"tnum\" style=\"\">471 / 500 字<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:94.19999999999999%\"><\/i><\/div><\/div>\n  <div style=\"display:flex;gap:6px\"><button class=\"btn btn-primary\" style=\"height:30px;flex:1\" data-t=\"一只鞋的旅行\" onclick=\"choose(this)\">选这个<\/button><button class=\"btn btn-ghost\" style=\"height:30px\" onclick=\"regen(this)\">换一个<\/button><\/div><\/article><\/div><\/div>\n    <aside class=\"inspector\"><div class=\"eyebrow\" style=\"margin:4px 0 6px\">选定后会锁定，下游扩写不能改<\/div>\n  <div class=\"lock\"><svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 11h14v10H5ZM8 11V7a4 4 0 0 1 8 0v4\"/><\/svg><div><b>故事核心<\/b><br>鞋是用来走路的，不是用来比的<\/div><\/div>\n  <div class=\"lock\"><svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 11h14v10H5ZM8 11V7a4 4 0 0 1 8 0v4\"/><\/svg><div><b>重场戏<\/b><br>姥爷认出这双鞋是他年轻时的<\/div><\/div>\n  <div class=\"lock\"><svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 11h14v10H5ZM8 11V7a4 4 0 0 1 8 0v4\"/><\/svg><div><b>人物动机<\/b><br>豆豆不是虚荣，是怕被同学看不起<\/div><\/div><div class=\"eyebrow\" style=\"margin-top:8px\">差异度<\/div>\n      <div style=\"font-size:12.5px\"><span class=\"muted\">冲突来源<\/span><br>道具 / 惩罚 / 回忆<\/div><div style=\"font-size:12.5px\"><span class=\"muted\">解决方式<\/span><br>认出旧主 / 旁观顿悟 / 物件讲述<\/div><div style=\"font-size:12.5px\"><span class=\"muted\">主笑点<\/span><br>失控 / 反差 / 吐槽<\/div><\/aside>\n  <\/main><script>function choose(b){document.querySelectorAll('.cand').forEach(c=>c.classList.remove('chosen'));b.closest('.cand').classList.add('chosen');toast('已选「'+b.dataset.t+'」 · 锁定故事核心后进入大纲');}\nasync function regen(b){const c=b.closest('.cand');c.style.opacity=.4;await wait(700);c.style.opacity=1;toast('已换一个走向 · 和其他两个的冲突来源不重复');}<\/script>\n<style>.cand{transition:opacity 200ms ease}.cand.chosen{box-shadow:inset 0 0 0 2px var(--accent)}<\/style><\/div>\n<\/div>\n<div class=\"toast\" id=\"toast\"><span><\/span><\/div>\n<script>// Shared runtime injected into every layer document.\n(function () {\n  // The parent switcher tells each layer which OS chrome to draw.\n  window.addEventListener('message', function (e) {\n    if (e.data && e.data.type === 'proto:os') document.body.dataset.os = e.data.os;\n  });\n  var os = new URLSearchParams(location.hash.slice(1)).get('os');\n  document.body.dataset.os = os || 'mac';\n\n  var toastTimer;\n  window.toast = function (text) {\n    var el = document.getElementById('toast');\n    if (!el) return;\n    el.querySelector('span').textContent = text;\n    el.classList.add('show');\n    clearTimeout(toastTimer);\n    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2600);\n  };\n  window.wait = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };\n  window.openModal = function (id) { document.getElementById(id).classList.add('open'); };\n  window.closeModal = function (id) { document.getElementById(id).classList.remove('open'); };\n  document.addEventListener('keydown', function (e) {\n    if (e.key === 'Escape') document.querySelectorAll('.scrim.open').forEach(function (s) { s.classList.remove('open'); });\n  });\n})();\n<\/script>\n<\/body>\n<\/html>","p5-a":"<!doctype html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>结构复刻 · 换成自己的人物 · A · Studio Paper<\/title>\n<style>/* Shared base for every layer. Direction themes only override tokens + layout. */\n*, *::before, *::after { box-sizing: border-box; }\nhtml, body { margin: 0; height: 100%; }\nbody {\n  font-family: var(--font-ui);\n  font-size: 14px;\n  line-height: 1.5;\n  color: var(--ink);\n  background: var(--desk);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  text-rendering: optimizeLegibility;\n  overflow: hidden;\n}\n:root {\n  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);\n  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);\n  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);\n  --font-mono: \"Courier Prime\", \"Courier New\", ui-monospace, monospace;\n  --font-script: \"Courier Prime\", \"Songti SC\", \"STSong\", \"SimSun\", \"Courier New\", monospace;\n}\nbutton, input, textarea, select { font: inherit; color: inherit; }\nbutton { cursor: pointer; border: 0; background: none; padding: 0; }\n:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }\n::selection { background: var(--selection); }\n.tnum { font-variant-numeric: tabular-nums; }\n\n/* ── Window chrome: mac / win, switched by the layer switcher via postMessage ── */\n.win { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--desk); }\n.titlebar {\n  height: 38px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 12px;\n  background: var(--chrome); border-bottom: 1px solid var(--line); user-select: none;\n  font-size: 12px; color: var(--ink-3);\n}\n.titlebar .title { flex: 1; text-align: center; font-weight: 500; color: var(--ink-2); }\n.lights { display: flex; gap: 8px; }\n.lights i { width: 12px; height: 12px; border-radius: 50%; display: block; }\n.lights i:nth-child(1) { background: #ff5f57; } .lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }\n.wincaps { display: none; margin-right: -12px; }\n.wincaps span { width: 46px; height: 38px; display: grid; place-items: center; color: var(--ink-2); font-size: 13px; }\nbody[data-os=\"win\"] .lights { display: none; }\nbody[data-os=\"win\"] .wincaps { display: flex; }\nbody[data-os=\"win\"] .titlebar .title { text-align: left; padding-left: 4px; }\n.app { flex: 1; min-height: 0; display: flex; }\n\n/* ── Primitives ── */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  height: 34px; padding: 0 14px; border-radius: var(--r-ctl); font-weight: 500; white-space: nowrap;\n  transition: transf n@starting-style { .enter { opacity: 0; transform: translateY(6px); } }\n\n/* Modal: centered, scales from .96 (never from 0). */\n.scrim { position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: center; z-index: 50;\n  opacity: 0; pointer-events: none; transition: opacity 200ms ease; }\n.scrim.open { opacity: 1; pointer-events: auto; }\n.modal { background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow-pop); width: min(560px, calc(100vw - 32px));\n  transform: scale(.96); opacity: 0; transition: transform 240ms var(--ease-out), opacity 200ms var(--ease-out); }\n.scrim.open .modal { transform: none; opacity: 1; }\n\n/* Toast: enters and exits from the bottom, the same direction. */\n.toast { position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 140%); opacity: 0; z-index: 60;\n  background: var(--toast); color: var(--on-toast); padding: 10px 14px; border-radius: 12px; box-shadow: var(--shadow-pop);\n  display: flex; gap: 10px; align-items: center; font-size: 13px; transition: transform 300ms var(--ease-out), opacity 200ms ease; }\n.toast.show { transform: translate(-50%, 0); opacity: 1; }\n\n/* Script page typography shared by both directions. */\n.sc-heading { font-weight: 700; text-transform: uppercase; margin: 22px 0 8px; }\n.sc-action { margin: 0 0 10px; }\n.sc-char { margin: 14px 0 0 38%; text-transform: uppercase; }\n.sc-paren { margin: 0 0 0 31%; }\n.sc-dial { margin: 0 18% 8px 24%; }\n.sc-trans { text-align: right; margin: 14px 0; text-transform: uppercase; }\n.sc-node { border-radius: 4px; transition: background-color 400ms ease; }\n.sc-node.writing { background: var(--write-hl); }\n\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after { transition-duration: 1ms !important; animation-duration: 1ms !important; }\n  .spin { animation: none; }\n}\n\n/* Direction A · Studio Paper — warm paper, serif display, vermilion seal accent.\n   The AI sits in a right-hand column; the script page is the hero. */\n:root {\n  --font-ui: -apple-system, BlinkMacSystemFont, \"PingFang SC\", \"Segoe UI\", \"Microsoft YaHei\", sans-serif;\n  --font-display: \"Songti SC\", \"STSong\", \"Noto Serif SC\", \"SimSun\", Georgia, serif;\n  --desk: #efebe3; --chrome: #e8e3d9; --surface: #fbf9f4; --paper: #fffdf8; --field: #fffdf8;\n  --ink: #1d1b18; --ink-2: #4a4640; --ink-3: #8a847a;\n  --line: #e2dccf; --line-strong: #d3cbbb;\n  --hover: #ece6da; --hover-strong: #e3dccd;\n  --accent: #b23a1d; --accent-hover: #9c321a; --on-accent: #fff8f2; --accent-ring: rgba(178,58,29,.18); --accent-soft: #f6e3da;\n  --ok: #3f7d4e; --selection: #f2d6c9; --write-hl: #fbe9c8;\n  --scrim: rgba(40, 32, 20, .28); --toast: #2a2622; --on-toast: #f5f1ea;\n  --r-ctl: 8px; --r-card: 14px;\n  --shadow-card: 0 1px 0 rgba(60,45,20,.04), 0 1px 3px rgba(60,45,20,.06);\n  --shadow-paper: 0 1px 2px rgba(60,45,20,.06), 0 8px 28px rgba(60,45,20,.08);\n  --shadow-pop: 0 12px 40px rgba(40,30,15,.18), 0 2px 6px rgba(40,30,15,.08);\n}\n.display { font-family: var(--font-display); font-weight: 600; letter-spacing: .01em; }\n.seal { width: 26px; height: 26px; border-radius: 6px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 14px; }\n.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; }\n\n/* App frame */\n.nav { width: 220px; flex: none; background: var(--chrome); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 14px 10px; gap: 2px; }\n.nav a { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-radius: 7px; color: var(--ink-2); text-decoration: none; cursor: default; }\n.nav a.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-card); font-weight: 500; }\n.nav .grow { flex: 1; }\n.nav .group { margin: 14px 10px 4px; }\n.main { flex: 1; min-width: 0; overflow: auto; }\n.card { background: va rid; place-items: center; color: var(--ink-3); transition: transform 160ms var(--ease-out); }\n.rail button:active { transform: scale(.95); }\n.rail button.on { background: var(--hover-strong); color: var(--ink); }\n.rail .grow { flex: 1; }\n.main { flex: 1; min-width: 0; overflow: auto; }\n.card { background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow-card); }\n\n/* Workspace: scene rail + focused page + floating command bar */\n.scene-rail { width: 210px; flex: none; padding: 16px 10px; overflow: auto; border-right: 1px solid var(--line); }\n.scene-rail .s { display: block; padding: 8px 10px; border-radius: 8px; color: var(--ink-3); font-size: 12.5px; }\n.scene-rail .s b { display: block; color: var(--ink-2); font-weight: 500; font-size: 13px; }\n.scene-rail .s.on { background: var(--hover); }\n.scene-rail .s.on b { color: var(--ink); }\n.focus { flex: 1; min-width: 0; position: relative; display: flex; flex-direction: column; }\n.focus-top { height: 44px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 16px; color: var(--ink-3); font-size: 12.5px; }\n.focus-scroll { flex: 1; overflow: auto; padding: 8px 0 160px; }\n.page { width: min(640px, calc(100% - 48px)); margin: 0 auto; font-family: var(--font-script); font-size: 14.5px; line-height: 1.7; color: var(--ink-2); }\n.page .sc-heading, .page .sc-char { color: var(--ink); }\n.cmdbar { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); width: min(620px, calc(100% - 40px));\n  background: rgba(26,29,35,.92); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);\n  border-radius: 14px; box-shadow: var(--shadow-pop); padding: 8px; }\n.cmdbar .row { display: flex; align-items: center; gap: 8px; }\n.cmdbar input { flex: 1; height: 38px; background: transparent; border: 0; outline: none; padding: 0 8px; font-size: 15px; }\n.agent-pill { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: flex; align-items: ce "opt\" style=\"padding:6px 10px\">门墩儿（只能借胡同里的老物件）<\/div><div class=\"muted\">对手 / 炫耀者<\/div><div>→<\/div><div class=\"opt\" style=\"padding:6px 10px\">同桌大壮<\/div><div class=\"muted\">严格的家长<\/div><div>→<\/div><div class=\"opt\" style=\"padding:6px 10px\">妈妈（护士，总在值夜班）<\/div><div class=\"muted\">温和的长辈<\/div><div>→<\/div><div class=\"opt\" style=\"padding:6px 10px\">姥爷（修车铺）<\/div><\/div><\/section>\n  <section class=\"card\" style=\"padding:16px;display:flex;align-items:center;gap:18px\">\n    <div style=\"flex:1\"><b>原创度检查<\/b><div class=\"muted\" style=\"font-size:12px\">结构借用是行业惯例；人物、道具、台词必须原创。<\/div><\/div>\n    <div style=\"text-align:center\"><div class=\"muted\" style=\"font-size:11.5px\">结构<\/div><b class=\"tnum\">借用<\/b><\/div><div style=\"text-align:center\"><div class=\"muted\" style=\"font-size:11.5px\">人物<\/div><b class=\"tnum\">0%<\/b><\/div><div style=\"text-align:center\"><div class=\"muted\" style=\"font-size:11.5px\">道具<\/div><b class=\"tnum\">原创<\/b><\/div><div style=\"text-align:center\"><div class=\"muted\" style=\"font-size:11.5px\">台词<\/div><b class=\"tnum\">0%<\/b><\/div>\n    <button class=\"btn btn-primary\" onclick=\"apply()\">套用到选题<\/button><\/section><\/div><div class=\"card\" style=\"padding:16px\"><div style=\"display:flex;align-items:center;gap:8px;margin-bottom:8px\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z\"/><\/svg><b style=\"flex:1\">诊断已有剧本 · 第 1 集 v3<\/b><span class=\"chip\">5,846 字<\/span><\/div>\n  <div style=\"display:flex;gap:8px;font-size:13px;padding:5px 0\"><span class=\"chip\" style=\"height:20px;color:var(--accent)\">高<\/span>主要笑点靠摔跤（第 4、9 场），与导演规则冲突<\/div><div style=\"display:flex;gap:8px;font-size:13px;padding:5px 0\"><span class=\"chip\" style=\"height:20px;color:var(--accent)\">高<\/span>第 8 场起主题偏到\"传统手艺\"，偏离当代孩子生活<\/div> ('open'); });\n  });\n})();\n<\/script>\n<\/body>\n<\/html>","p6-a":"<!doctype html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>剧本工作区 · AI 写作 · A · Studio Paper<\/title>\n<style>/* Shared base for every layer. Direction themes only override tokens + layout. */\n*, *::before, *::after { box-sizing: border-box; }\nhtml, body { margin: 0; height: 100%; }\nbody {\n  font-family: var(--font-ui);\n  font-size: 14px;\n  line-height: 1.5;\n  color: var(--ink);\n  background: var(--desk);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  text-rendering: optimizeLegibility;\n  overflow: hidden;\n}\n:root {\n  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);\n  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);\n  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);\n  --font-mono: \"Courier Prime\", \"Courier New\", ui-monospace, monospace;\n  --font-script: \"Courier Prime\", \"Songti SC\", \"STSong\", \"SimSun\", \"Courier New\", monospace;\n}\nbutton, input, textarea, select { font: inherit; color: inherit; }\nbutton { cursor: pointer; border: 0; background: none; padding: 0; }\n:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }\n::selection { background: var(--selection); }\n.tnum { font-variant-numeric: tabular-nums; }\n\n/* ── Window chrome: mac / win, switched by the layer switcher via postMessage ── */\n.win { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--desk); }\n.titlebar {\n  height: 38px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 12px;\n  background: var(--chrome); border-bottom: 1px solid var(--line); user-select: none;\n  font-size: 12px; color: var(--ink-3);\n}\n.titlebar .title { flex: 1; text-align: center; font-weight: 500; color: var(--ink-2); }\n.lights { display: flex; gap: 8px; }\n.lights i { width: 12px; height: 12px; border-radius: 50%; display: block; }\n.lights i:nth-child(1) { background: #ff5f57; } .lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }\n.wincaps { display: none; margin-right: -12px; }\n.wincaps span { width: 46px; height: 38px; display: grid; place-items: center; color: var(--ink-2); font-size: 13px; }\nbody[data-os=\"win\"] .lights { display: none; }\nbody[data-os=\"win\"] .wincaps { display: flex; }\nbody[data-os=\"win\"] .titlebar .title { text-align: left; padding-left: 4px; }\n.app { flex: 1; min-height: 0; display: flex; }\n\n/* ── Primitives ── */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  height: 34px; padding: 0 14px; border-radius: var(--r-ctl); font-weight: 500; white-space: nowrap;\n  transition: transform 160ms var(--ease-out), background-color 160ms ease, box-shadow 160ms ease;\n}\n.btn:active { transform: scale(0.97); }\n.btn-primary { background: var(--accent); color: var(--on-accent); }\n.btn-ghost { background: transparent; color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line-strong); }\n.btn-quiet { background: var(--hover); color: var(--ink-2); }\n@media (hover: hover) and (pointer: fine) {\n  .btn-primary:hover { background: var(--accent-hover); }\n  .btn-ghost:hover, .btn-quiet:hover { background: var(--hover-strong); }\n}\n.btn[disabled] { opacity: .45; pointer-events: none; }\n.input {\n  width: 100%; height: 40px; padding: 0 12px; border-radius: var(--r-ctl);\n  background: var(--field); border: 1px solid var(--line-strong); font-size: 16px;\n  transition: border-color 160ms ease, box-shadow 160ms ease;\n}\n.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }\n.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12px; background: var(--hover); color: var(--ink-2); }\n.kbd { font-family: var(--font-mono); font-size: 11px; padding: 1px  class=\"sc-node sc-paren\">（目瞪口呆）<\/p><p class=\"sc-node sc-dial\">他……他还没听见哨呢！<\/p><\/article><\/div>\n  <\/section>\n  <aside class=\"ws-right\">\n    <div class=\"ai-head\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8Z\"/><\/svg><b style=\"flex:1;font-weight:600\">编剧助手<\/b><span class=\"chip tnum\">团队本月 61%<\/span><\/div>\n    <div class=\"ai-body\" id=\"feed\">\n      <div style=\"display:flex;flex-direction:column;gap:6px\"><div class=\"eyebrow\" style=\"margin:4px 0 6px\">选定后会锁定，下游扩写不能改<\/div>\n  <div class=\"lock\"><svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 11h14v10H5ZM8 11V7a4 4 0 0 1 8 0v4\"/><\/svg><div><b>故事核心<\/b><br>鞋是用来走路的，不是用来比的<\/div><\/div>\n  <div class=\"lock\"><svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 11h14v10H5ZM8 11V7a4 4 0 0 1 8 0v4\"/><\/svg><div><b>重场戏<\/b><br>姥爷认出这双鞋是他年轻时的<\/div><\/div>\n  <div class=\"lock\"><svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 11h14v10H5ZM8 11V7a4 4 0 0 1 8 0v4\"/><\/svg><div><b>人物动机<\/b><br>豆豆不是虚荣，是怕被同学看不起<\/div><\/div><\/div>\n      <div class=\"muted\" style=\"font-size:13px\">按分场第 3 场来写？我会带上锁定的核心和导演规则。写完每一轮都能一键撤销。<\/div>\n    <\/div>\n    <div class=\"ai-foot\">\n      <div class=\"composer\"><textarea id=\"ask\">按分场写第 3 场：鞋拖着豆豆跑过胡同。<\/textarea>\n        <div style=\"display:flex;align-items:center;gap:6px\"><button class=\"chip\"><svg width=\"13\" hei
