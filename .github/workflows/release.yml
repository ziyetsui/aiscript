# Spec 0002 §13.3: tag → matrix build (mac arm64/x64 + win x64) → sign / notarize when secrets exist
# → draft release in the public releases repo → promote after smoke testing.
name: Release
permissions:
  contents: write

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare one draft for both platforms
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          gh release view "v$version" >/dev/null 2>&1 || gh release create "v$version" --draft --target "$GITHUB_SHA" --title "$version" --notes 'Candidate build; signing and customer acceptance pending.'
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test
      - name: Offline-activation public key
        shell: bash
        env:
          LICENSE_PUBLIC_KEY: ${{ vars.LICENSE_PUBLIC_KEY }}
        run: |
          mkdir -p apps/desktop/resources
          if [ -n "$LICENSE_PUBLIC_KEY" ]; then printf '%s\n' "$LICENSE_PUBLIC_KEY" > apps/desktop/resources/license-public.pem; fi
          test -s apps/desktop/resources/license-public.pem || { echo "::error::Missing license public key"; exit 1; }
      - name: Build and publish (draft)
        working-directory: apps/desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }} # write access to ziyeprompttheworld/aiscript
          KEYGEN_ACCOUNT_ID: ${{ vars.KEYGEN_ACCOUNT_ID }}
          KEYGEN_VERIFY_KEY: ${{ vars.KEYGEN_VERIFY_KEY }}
          # macOS signing + notarization (Apple Developer ID). Unsigned when absent.
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
          # Windows: Azure Trusted Signing. Unsigned when absent.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          # An absent secret becomes an empty env value; builder treats empty CSC_LINK as a path.
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET; do
            if [ -z "${!name}" ]; then unset "$name"; fi
          done
          pnpm exec electron-vite build && pnpm exec electron-builder ${{ matrix.target }} --publish always

      - name: Scan packaged resources
        working-directory: apps/desktop
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            node ../../scripts/scan-package.mjs release/win-unpacked/resources/app.asar
          else
            for archive in release/mac*/Ancher\ Scripter.app/Contents/Resources/app.asar; do
              node ../../scripts/scan-package.mjs "$archive"
            done
          fi

      - name: Installed Windows package smoke
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/*-win-x64-setup.exe | Select-Object -First 1
          $installPath = Join-Path $env:RUNNER_TEMP 'aiscript-install'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installPath") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $exe = Join-Path $installPath 'Ancher Scripter.exe'
          if (-not (Test-Path $exe)) { throw 'Installed executable missing' }
          pnpm exec node e2e/package-smoke.mjs "$exe" packaged-windows-installed-activation.png
          if ($LASTEXITCODE -ne 0) { throw 'Installed package startup failed' }
      - name: macOS package smoke
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        run: |
          if [ "$(uname -m)" = arm64 ]; then pkg=mac-arm64; else pkg=mac; fi
          pnpm exec node e2e/package-smoke.mjs "release/$pkg/Ancher Scripter.app/Contents/MacOS/Ancher Scripter" packaged-mac-ci-activation.png
      - name: Preserve startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-evidence-${{ matrix.os }}
          path: delivery/evidence/*.png
          if-no-files-found: warn

      - name: Preserve installer artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
          if-no-files-found: warn
